<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Faqja nuk u gjet — Bizhuteria Fantazia</title>
  <meta name="robots" content="noindex, follow">
  <link rel="icon" type="image/png" sizes="96x96" href="images/icons/favicon-96.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300;1,400&family=DM+Sans:wght@200;300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0D1810;
      color: #EDDBA8;
      font-family: 'DM Sans', sans-serif;
      font-weight: 300;
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 24px;
      position: relative;
      overflow: hidden;
    }
    .wm {
      position: absolute;
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-weight: 300;
      font-size: clamp(200px, 44vw, 520px);
      color: rgba(200,169,110,0.045);
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      user-select: none;
      line-height: 1;
    }
    .brand-top {
      font-size: 10px;
      letter-spacing: 0.42em;
      text-transform: uppercase;
      color: rgba(122,158,126,0.6);
      margin-bottom: 10px;
    }
    .brand {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-weight: 300;
      font-size: clamp(40px, 8vw, 64px);
      color: #EDDBA8;
      line-height: 1;
      margin-bottom: 34px;
    }
    .rule {
      width: 64px; height: 1px;
      background: linear-gradient(to right, transparent, #C9A961, transparent);
      margin: 0 auto 34px;
    }
    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-weight: 400;
      font-size: clamp(24px, 5vw, 36px);
      color: rgba(237,219,168,0.9);
      margin-bottom: 14px;
    }
    p {
      font-size: 13px;
      color: rgba(181,201,183,0.65);
      line-height: 1.9;
      max-width: 420px;
      margin: 0 auto 36px;
    }
    a.home {
      display: inline-block;
      border: 1px solid rgba(200,169,110,0.6);
      color: #EDDBA8;
      padding: 15px 44px;
      letter-spacing: 0.22em;
      font-size: 10px;
      text-transform: uppercase;
      text-decoration: none;
      transition: background 0.35s, color 0.35s;
    }
    a.home:hover { background: #C9A961; color: #0D1810; }
    .content { position: relative; z-index: 1; }
  </style>
</head>
<body>
  <span class="wm" aria-hidden="true">404</span>
  <div class="content">
    <span class="brand-top">Bizhuteria</span>
    <div class="brand">Fantazia</div>
    <div class="rule"></div>
    <h1>Faqja nuk u gjet · Page not found</h1>
    <p>Kjo faqe nuk ekziston ose është zhvendosur. Kthehuni te koleksioni ynë.<br>
       <em>This page doesn't exist or has been moved. Return to our collection.</em></p>
    <a class="home" href="/">Kthehu në Fillim · Back Home</a>
  </div>
</body>
</html>
